# zorkcoind RPC settings (linearize-hashes)
rpcuser=someuser
rpcpassword=somepassword
#datadir=~/.zorkcoin
host=127.0.0.1

#mainnet default
port=24300

#testnet default
#port=23294

#regtest default
#port=20496

#signet default
#port=38332

# bootstrap.dat hashlist settings (linearize-hashes)
max_height=313000

# bootstrap.dat input/output settings (linearize-data)

# mainnet
netmagic=f71ddc3d
genesis=7cf82bc4004333ce710839658d51d21a42ee9281a4965b4745072efd397dc033
input=/home/example/.zorkcoin/blocks

# testnet
#netmagic=f72ddc3d
#genesis=0cc09ce62466146e81d6f95bfb5932f99aae49850423356a7a22bbf18ba3d4f4
#input=/home/example/.zorkcoin/testnet/blocks

# regtest
#netmagic=f74ddc3d
#genesis=91f98a09eac44a0c02472242b3400e990fa29b8d8d02f37b7d2b60601e61b7fd
#input=/home/example/.bitcoin/regtest/blocks

# signet
#netmagic=0a03cf40
#genesis=00000008819873e925422c1ff0f99f7cc9bbb232af63a077a480a3633bee1ef6
#input=/home/example/.bitcoin/signet/blocks

# "output" option causes blockchain files to be written to the given location,
# with "output_file" ignored. If not used, "output_file" is used instead.
# output=/home/example/blockchain_directory
output_file=/home/example/Downloads/bootstrap.dat
hashlist=hashlist.txt

# Maximum size in bytes of out-of-order blocks cache in memory
out_of_order_cache_sz = 100000000

# Do we want the reverse the hash bytes coming from getblockhash?
rev_hash_bytes = False

# On a new month, do we want to set the access and modify times of the new
# blockchain file?
file_timestamp = 0
# Do we want to split the blockchain files given a new month or specific height?
split_timestamp = 0

# Do we want debug printouts?
debug_output = False
